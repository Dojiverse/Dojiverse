<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Meridian: a drift report with one sleeve out of its band">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b16"/>
      <stop offset="1" stop-color="#17352a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <text x="56" y="86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" fill="#e8f1ec" letter-spacing="-0.5">Meridian</text>
  <text x="56" y="116" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#9fbcae">tax-aware rebalancing · every amount on the wire is a string</text>

  <!-- column headers -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6f8f80">
    <text x="56" y="170">SLEEVE</text>
    <text x="300" y="170">ACTUAL vs TARGET</text>
    <text x="700" y="170" text-anchor="end">DRIFT</text>
  </g>
  <line x1="56" y1="182" x2="744" y2="182" stroke="#2a4a3c" stroke-width="1"/>

  <!-- track helper: bands drawn as brackets on a 0-70% scale, 320px wide starting at x=300 -->
  <!-- equity: target 55, band 50-60, actual 60.6 -> breach -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="232" font-size="18" font-weight="600" fill="#e8f1ec">equity</text>
    <rect x="300" y="218" width="320" height="18" rx="4" fill="#1d3a2e"/>
    <rect x="528" y="214" width="46" height="26" rx="3" fill="none" stroke="#5fd39b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="300" y="218" width="277" height="18" rx="4" fill="#5fd39b"/>
    <circle cx="551" cy="227" r="3" fill="#0f1b16"/>
    <text x="700" y="233" text-anchor="end" font-size="18" font-weight="600" fill="#f08a7a">+5.6%</text>
    <rect x="708" y="214" width="36" height="24" rx="12" fill="#3a1f1b"/>
    <text x="726" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#f08a7a">!</text>
  </g>

  <!-- bond: target 35, band 30-40, actual 32.1 -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="292" font-size="18" font-weight="600" fill="#e8f1ec">bond</text>
    <rect x="300" y="278" width="320" height="18" rx="4" fill="#1d3a2e"/>
    <rect x="437" y="274" width="46" height="26" rx="3" fill="none" stroke="#5fd39b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="300" y="278" width="147" height="18" rx="4" fill="#8fc7ad"/>
    <circle cx="460" cy="287" r="3" fill="#0f1b16"/>
    <text x="700" y="293" text-anchor="end" font-size="18" font-weight="600" fill="#9fbcae">−2.9%</text>
  </g>

  <!-- alt: target 10, band 7-13, actual 7.3 -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="352" font-size="18" font-weight="600" fill="#e8f1ec">alt</text>
    <rect x="300" y="338" width="320" height="18" rx="4" fill="#1d3a2e"/>
    <rect x="332" y="334" width="28" height="26" rx="3" fill="none" stroke="#5fd39b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="300" y="338" width="33" height="18" rx="4" fill="#8fc7ad"/>
    <circle cx="346" cy="347" r="3" fill="#0f1b16"/>
    <text x="700" y="353" text-anchor="end" font-size="18" font-weight="600" fill="#9fbcae">−2.7%</text>
  </g>

  <line x1="56" y1="392" x2="744" y2="392" stroke="#2a4a3c" stroke-width="1"/>

  <!-- footer line: the block -->
  <rect x="56" y="412" width="688" height="52" rx="8" fill="#2a1a17" stroke="#6b2d25" stroke-width="1"/>
  <text x="76" y="434" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#f08a7a">BLOCK GLD</text>
  <text x="76" y="452" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#e2b3ab">selling at a loss would be washed by a Roth purchase — PERMANENTLY FORFEITED  [Rev. Rul. 2008-5]</text>
</svg>
