<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Market Canvas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      background: url('ChatGPT Image May 28, 2025, 03_31_25 AM.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px #000;
    }
    form {
      background: rgba(20, 20, 40, 0.8);
      border-radius: 16px;
      padding: 2.5rem 2.5rem 1.5rem 2.5rem;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
      max-width: 400px;
      width: 90vw;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    label {
      text-align: left;
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      background: #222;
      color: #fff;
      resize: vertical;
    }
    textarea {
      min-height: 100px;
      max-height: 300px;
    }
    button[type="submit"] {
      background: #1e293b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    button[type="submit"]:hover {
      background: #334155;
    }
    .back-link {
      color: #fff;
      text-decoration: underline;
      margin-top: 2rem;
      display: inline-block;
      font-size: 1rem;
    }
    .success-message {
      color: #4ade80;
      margin-top: 1rem;
      font-size: 1.1rem;
    }
    .error-message {
      color: #f87171;
      margin-top: 1rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Contact Us</h1>
    <form id="contact-form" action="https://formspree.io/f/xjvnlqzq" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Send Message</button>
      <div id="form-status"></div>
    </form>
    <a href="index.html" class="back-link">&larr; Back to Home</a>
  </div>
  <script>
    // Optional: Show a message after form submission
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        status.textContent = 'Thank you for your message! We will get back to you soon.';
        status.className = 'success-message';
        form.reset();
      } else {
        status.textContent = 'Oops! There was a problem sending your message.';
        status.className = 'error-message';
      }
    });
  </script>
</body>
</html>
